# Tiny Tapeout project information
project:
  title:        "HDC Classifier"
  author:       "Shivashankar Ravindra Ugar, Tarun S K, Shylashree N, RV College of Engineering"
  discord:      ""
  description:  "8-bit Hyperdimensional Computing classifier with two class prototypes"
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design occupies
  tiles: "1x1"

  # Must exactly match the module name in src/project.v
  top_module:  "tt_um_hdc_classifier"

  # Source files
  source_files:
    - "project.v"

# Pinout
pinout:
  # Inputs
  ui[0]: "DATA[0]"
  ui[1]: "DATA[1]"
  ui[2]: "DATA[2]"
  ui[3]: "DATA[3]"
  ui[4]: "DATA[4]"
  ui[5]: "DATA[5]"
  ui[6]: "DATA[6]"
  ui[7]: "DATA[7]"

  # Outputs
  uo[0]: "DIST[0]"
  uo[1]: "DIST[1]"
  uo[2]: "DIST[2]"
  uo[3]: "DIST[3]"
  uo[4]: "DIST[4]"
  uo[5]: "DIST[5]"
  uo[6]: "WINNER"
  uo[7]: "DONE"

  # Bidirectional pins
  uio[0]: "MODE"
  uio[1]: "CLASS_SEL"
  uio[2]: "VALID"
  uio[3]: "START"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
