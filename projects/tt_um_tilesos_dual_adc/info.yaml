# Tiny Tapeout project information
project:
  title: "Dual-Path Noise-Shaping ADC"
  author: "Tyler McClure"
  discord: "tiles_os"
  description: "Two ADC architectures share one analog input: a VCO pulse-frequency path and a first-order switched-capacitor delta-sigma bitstream, with a buffered analog loop monitor."
  language: "Analog"
  clock_hz: 1000000

  # A SKY130 2x2 analog template has a 334.88 x 225.76 um die area.
  tiles: "2x2"

  # ua[0] is the shared converter input; ua[1] is the buffered DSM monitor.
  analog_pins: 2
  uses_vapwr: false

  top_module: "tt_um_tilesos_dual_adc"

  # Source files must be in ./src and listed separately.
  source_files:
    - "project.v"

# Pinout for the datasheet/website. Leave unused pins blank. Do not add or
# remove entries.
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "VCO-ADC pulse train"
  uo[1]: "Delta-sigma bitstream"
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

  # Analog pins
  ua[0]: "Shared analog input"
  ua[1]: "Buffered delta-sigma loop monitor"
  ua[2]: ""
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6
