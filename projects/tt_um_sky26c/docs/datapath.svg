<text x="1205" y="438" text-anchor="middle" font-size="9.5" fill="#52514e">{V[7:1], spike}</text>
<text x="20" y="606" font-size="10" fill="#52514e">All rescales are power-of-two slices with round-to-nearest; every stage saturates rather than wraps. Coefficients are compile-time constants (shift-in registers once the load path exists).</text>
<text x="20" y="622" font-size="10" fill="#52514e">α = 25/256, β = 56/256, r_inf = 25/81 · g_max = 255 · E_rev = 255 · LEAK = 16 · V_threshold = 192 · Under voltage clamp V is held and the driving force is unity, so uo_out reports g directly.</text>
