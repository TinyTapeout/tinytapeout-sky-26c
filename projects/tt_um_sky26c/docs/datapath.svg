<text x="590.0" y="97" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">round ≫16</text>
<text x="590.0" y="112" text-anchor="middle" font-size="10" fill="#52514e">Q0.32 → Q0.16</text>
