# Tiny Tapeout project information
project:
  title:        "Acoustic Interferometer"      # Project title
  author:       "Josef Gajdusek"      # Your name
  discord:      "__atx__"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Displays direction of arrival for a 20kHz tone"      # One line description of what your project does
  language:     "Chisel" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10240000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_atx_phased_interferometer"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_atx_phased_interferometer.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "MIC_LEFT"
  ui[1]: "MIC_RIGHT"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "PDM_CLK"
  uo[1]: "LED_POS"
  uo[2]: "LED_NEG"
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "LED_0"
  uio[1]: "LED_1"
  uio[2]: "LED_2"
  uio[3]: "LED_3"
  uio[4]: "LED_4"
  uio[5]: "LED_5"
  uio[6]: "LED_6"
  uio[7]: "LED_7"

# Do not change!
yaml_version: 6
