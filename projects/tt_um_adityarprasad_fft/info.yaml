# Tiny Tapeout project information
project:
  title:        "Adaptive-Precision FFT"      
  author:       "Aditya R Prasad, Suddep P Hande, Shylashree N, RV College of Engineering"      
  discord:      ""      
  description:  "An Error-Budget-Driven Adaptive-Precision Architecture for Efficient FFT Processing"     
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     100000000      # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_adityarprasad_fft"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "fft_DUT.v"
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "DATA[0]"
  ui[1]: "DATA[1]"
  ui[2]: "DATA[2]"
  ui[3]: "DATA[3]"
  ui[4]: "DATA[4]"
  ui[5]: "DATA[5]"
  ui[6]: "DATA[6]"
  ui[7]: "DATA[7]"

  # Outputs
  uo[0]: "RESULT[0]"
  uo[1]: "RESULT[1]"
  uo[2]: "RESULT[2]"
  uo[3]: "RESULT[3]"
  uo[4]: "RESULT[4]"
  uo[5]: "RESULT[5]"
  uo[6]: "RESULT[6]"
  uo[7]: "RESULT[7]"

  # Bidirectional pins
  uio[0]: "PRECISION[0]"
  uio[1]: "PRECISION[1]"
  uio[2]: "ESCALATED"
  uio[3]: "VALID"
  uio[4]: "BUSY"
  uio[5]: "START"
  uio[6]: "ERROR_BUDGET[0]"
  uio[7]: "ERROR_BUDGET[1]"

# Do not change!
yaml_version: 6
