# Tiny Tapeout project information
project:
  title: "Programmable Metasurface Beam Controller"
  author: "Osian Edwards"
  discord: ""
  description: "Verilog controller generating selectable digital control patterns for a programmable metasurface demonstrator."
  language: "Verilog"
  clock_hz: 0

  tiles: "1x1"

  top_module: "tt_um_osian_beam_controller"

  source_files:
    - "project.v"

pinout:
