  "ui[0]": "Beam mode bit 0"
  "ui[1]": "Beam mode bit 1"
  "ui[2]": ""
  "ui[3]": ""
  "ui[4]": ""
  "ui[5]": ""
  "ui[6]": ""
  "ui[7]": ""

  # Outputs
  "uo[0]": "Control pattern bit 0"
  "uo[1]": "Control pattern bit 1"
  "uo[2]": "Control pattern bit 2"
  "uo[3]": "Control pattern bit 3"
  "uo[4]": "Control pattern bit 4"
  "uo[5]": "Control pattern bit 5"
  "uo[6]": "Control pattern bit 6"
  "uo[7]": "Control pattern bit 7"

  # Bidirectional pins
  "uio[0]": ""
  "uio[1]": ""
