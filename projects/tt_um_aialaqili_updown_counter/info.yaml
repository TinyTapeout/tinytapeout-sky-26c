# Tiny Tapeout project information
project:
  title: "4-bit Up/Down Counter"
  author: "Abdulla Alaqili"
  discord: ""
  description: "A synchronous 4-bit up/down counter. ui_in[0] sets direction, ui_in[1] enables counting, rst_n clears the count to zero."
  language: "Verilog"
  clock_hz: 1000000

  tiles: "1x1"

  top_module: "tt_um_aialaqili_updown_counter"

  source_files:
    - "project.v"

pinout:
  ui[0]: "direction (1=up, 0=down)"
  ui[1]: "count_en (1=count, 0=hold)"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  uo[0]: "count[0]"
  uo[1]: "count[1]"
  uo[2]: "count[2]"
  uo[3]: "count[3]"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
