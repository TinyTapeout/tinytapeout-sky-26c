# Tiny Tapeout project information
project:
  title:        "UCIe-style SERDES with analog TX driver & RX slicer"      # Project title
  author:       "Priyabrata Dash"      # Your name
  discord:      "dash_84014"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "8b/10b SERDES loopback: PRBS BIST, 3x-oversampling CDR, custom analog driver out ua[0], Schmitt slicer in ua[1]"      # One line description of what your project does
  language:     "Analog" # other examples include Verilog, Amaranth, VHDL, etc
  clock_hz:     66500000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values for analog projects: 1x2, 2x2

  # How many analog pins does your project use?
  analog_pins: 2        # Valid values: 0 to 6
  uses_vapwr: false       # Set to true if your project uses second analog power supply (VAPWR) in addition to 1.8V (VDPWR)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_serdes_ephotonics"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:        
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "prbs_gen_en (1=transmit PRBS self-test pattern)"
  ui[1]: "prbs_chk_en (1=enable RX PRBS checker)"
  ui[2]: "dig_loopback (1=internal digital loopback, bypass analog)"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "rx_aligned (word aligner locked)"
  uo[1]: "cdr_locked (clock recovery locked)"
  uo[2]: "prbs_sync (checker synchronized)"
  uo[3]: "heartbeat (~2.1 Hz blink)"
  uo[4]: "prbs_err_cnt[0]"
  uo[5]: "prbs_err_cnt[1]"
  uo[6]: "prbs_err_cnt[2]"
  uo[7]: "prbs_err_cnt[3]"

  # Bidirectional pins
  uio[0]: "prbs_err_cnt[4] (output)"
  uio[1]: "prbs_err_cnt[5] (output)"
  uio[2]: "prbs_err_cnt[6] (output)"
  uio[3]: "prbs_err_cnt[7] (output)"
  uio[4]: "prbs_err_cnt[8] (output)"
  uio[5]: "prbs_err_cnt[9] (output)"
  uio[6]: "prbs_err_cnt[10] (output)"
  uio[7]: "prbs_err_cnt[11] (output)"

  # Analog pins - make sure to also set "analog_pins" above, else the pins won't be connected
  ua[0]: "TX driver output (22.2 Mbps serial, drive to ua[1] via ~50R)"
  ua[1]: "RX slicer input (Schmitt trigger, 0.62 V hysteresis)"
  ua[2]: ""
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6
