# Comparator source: Comparator_Scientific_Characterization.xlsx, PVT_All_Data.
# TT, VDD=1.0 V, 27 C: decision=3.78 ns, reset=4.29 ns, power=108.841 uW.
# Comparator SF/SS at 0.95 V and 0 C have incomplete decision-time results.
# LDO Load Regulation: 0 to 10 mA, TT 27 C, delta Vout=5.616535 mV.
# The workbook's Vin-Vout columns describe headroom, not a measured dropout limit.
# Characterization source: SKY130_LDO_Ver3_PRE.xlsx, pre-layout simulation.
# LDO nominal output approximately 1.0 V; these are not silicon guarantees.
# Load Regulation, TT 27 C: Vout=1.00392632 V at 0 A;
# Vout=0.998309785 V at 10 mA; ground current=38.5997397 uA at no load.
# Line Regulation DE6/DE9: 4.55927 / 4.02168 mV/V, Vin 1.2 to 1.5 V,
# no load / max load respectively, TT 27 C.
# Pin names retained from supplied layout metadata; no connectivity changes.
# Tiny Tapeout project information
project:
  title:        "CTW LDO and Dynamic Comparator"      # Project title
  author:       "TuanKiet"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Analog LDO and dynamic comparator test chip in SKY130"      # One line description of what your project does
  language:     "Analog" # other examples include Verilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values for analog projects: 1x2, 2x2

  # How many analog pins does your project use?
  analog_pins: 6        # Valid values: 0 to 6
  uses_3v3: false       # Set to true if your project uses 3.3V (VAPWR) in addition to 1.8V (VDPWR)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_SAR_ADC"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:        
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "CLKB"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "OUT+"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

  # Analog pins - make sure to also set "analog_pins" above, else the pins won't be connected
  ua[0]: "OUT_LDO"
  ua[1]: "OUT-"
  ua[2]: "VIN+"
  ua[3]: "VIN-"
  ua[4]: "VDD"
  ua[5]: "VREF"

# Do not change!
yaml_version: 6
