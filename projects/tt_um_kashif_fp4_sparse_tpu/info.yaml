# Tiny Tapeout project information
project:
  title:        "FP4 Sparse Mini-TPU"
  author:       "Kashif Rasul"
  discord:      "kashf"
  description:  "One time-multiplexed PE computes a 3x3 output tile with 1:2-sparse E2M1 weights and INT8 activations, without a hardware multiplier. Dense E2M1-weight mode runs at half the sparse contraction rate; NVFP4/MXFP4 weight payloads require host-side activation quantization and scale handling."
  language:     "Verilog"
  clock_hz:     10000000

  tiles: "1x2"
  top_module:  "tt_um_kashif_fp4_sparse_tpu"

  source_files:
    - "project.v"
    - "tpu.v"
    - "spi.v"
    - "control.v"
    - "memory_a.v"
    - "memory_b.v"
    - "result_mem.v"
    - "pe.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "SPI MOSI"
  ui[1]: "SPI CS (active low)"
  ui[2]: "SPI SCLK"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "result bit 0"
  uo[1]: "result bit 1"
  uo[2]: "result bit 2"
  uo[3]: "result bit 3"
  uo[4]: "result bit 4"
  uo[5]: "result bit 5"
  uo[6]: "result bit 6"
  uo[7]: "result bit 7"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: "ready (sticky until next RUN)"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
