# Tiny Tapeout project information
project:
  title:        "LIF Neuron SNN"      # LIF neruon chip
  author:       "Virginia"      # Virginia Baker
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Two neuron leaky integrate and fire SNN accelerator"      # Two neuron leaky integrate and fire SNN accelerator
  language:     "Verilog" 
  clock_hz:     100000000       # Clock frequency id 10MHz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"         

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_amazing_sage_snn"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "lif_neuron.v"
    - "weight_buff.v"
    - "bw_multiplier.v"
    - "bw_encoder.v"
    - "bw_gen.v"
    - "bw_partial_product.v"
    - "CPA.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "data[0]"
  ui[1]: "data[1]"
  ui[2]: "data[2]"
  ui[3]: "data[3]"
  ui[4]: "data[4]"
  ui[5]: "data[5]"
  ui[6]: "data[6]"
  ui[7]: "data[7]"

  # Outputs
  uo[0]: "v_mem_bit[0]"
  uo[1]: "v_mem_bit[1]"
  uo[2]: "v_mem_bit[2]"
  uo[3]: "v_mem_bit[3]"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "load_x_low"
  uio[1]: "load_x_high"
  uio[2]: "write_weight"
  uio[3]: "read_weight"
  uio[4]: "step"
  uio[5]: "neuron_select"
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
