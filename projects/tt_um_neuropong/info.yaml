# Tiny Tapeout project information
project:
  title:        "NeuroPong"      # Project title
  author:       "Michiel Vanzeir, Jonas Reynders"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Play Pong against an AI opponent"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25175000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "3x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_neuropong"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "VGA_sync.v"
    - "pong_logic.v"
    - "render.v"
    - "score_render.v"
    - "neural_net.v"
    - "paddle_reflection.v"
    - "wins_render.v"
    - "blue_render.v"
    - "red_render.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "L_PDL_UP"
  ui[1]: "L_PDL_DOWN"
  ui[2]: "R_PDL_UP"
  ui[3]: "R_PDL_DOWN"
  ui[4]: "GAME_RESET"
  ui[5]: "R_PLAYER_ENABLE"
  ui[6]: "WEIGHT_LOAD"
  ui[7]: "WEIGHT_IN"

  # Outputs
  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VSYNC"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "HSYNC"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
