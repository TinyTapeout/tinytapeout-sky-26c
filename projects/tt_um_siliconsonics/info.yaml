# Tiny Tapeout project information
project:
  title:        "ultrasonic sonar: range and bearing"      # Project title
  author:       "SiliconSonics"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Digital sonar processor. Drives a 40 kHz ultrasonic transducer, demodulates the returning echo from two PDM microphones with square-wave I/Q correlators, and reports echo distance and bearing on parallel pins and over a 115200 baud UART. Supports single-shot and once-per-second automatic measurement, single-microphone boards, and UART-tunable detection thresholds."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     40000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_siliconsonics"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "main.v"
    - "data_mux.v"
    - "clk_div_10.v"
    - "ref_sig.v"
    - "correlator.v"
    - "windowed_iq_demodulator.v"
    - "echo_angle_detector.v"
    - "transducer_ping_generator.v"
    - "mic_clock_sequence.v"
    - "atan2_cordic_16b.v"
    - "phase_difference_to_angle.v"
    - "uart_tx.v"
    - "uart_rx.v"
    - "byte_fifo.v"
    - "measurement_controller.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "start_measurement (rising edge)"
  ui[1]: "mic1_pdm"
  ui[2]: "mic2_pdm"
  ui[3]: "mux_sel"
  ui[4]: "uart_rx"
  ui[5]: "auto_enable"
  ui[6]: "single_mic"
  ui[7]: "restart_mic"

  # Outputs
  # mux_sel low : data_out = echo_window_index[11:0]
  # mux_sel high: data_out = {auto_mode, mic_ready, busy, result_ready, 1'b0, single_mic, angle[5:0]}
  uo[0]: "data_out[0]"
  uo[1]: "data_out[1]"
  uo[2]: "data_out[2]"
  uo[3]: "data_out[3]"
  uo[4]: "data_out[4]"
  uo[5]: "data_out[5]"
  uo[6]: "data_out[6]"
  uo[7]: "data_out[7]"

  # Bidirectional pins

  uio[0]: "data_out[8]"
  uio[1]: "data_out[9]"
  uio[2]: "data_out[10]"
  uio[3]: "data_out[11]"
  uio[4]: "uart_tx"
  uio[5]: "transducer_drive_a"
  uio[6]: "transducer_drive_b"
  uio[7]: "mic_clk"

# Do not change!
yaml_version: 6
