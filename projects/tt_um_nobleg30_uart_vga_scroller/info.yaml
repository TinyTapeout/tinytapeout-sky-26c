# Tiny Tapeout project information
project:
  title: "UART VGA Text Scroller"
  author: "Noble G"
  discord: ""
  description: "Receives a text message over UART and scrolls it across a 640x480 VGA display."
  language: "Verilog"
  clock_hz: 25175000
  tiles: "1x2"
  top_module: "tt_um_nobleg30_uart_vga_scroller"

  source_files:
    - "project.v"

pinout:
  # Inputs
  ui[0]: "Scroll speed bit 0"
  ui[1]: "Scroll speed bit 1"
  ui[2]: "Pause scrolling"
  ui[3]: "UART RX"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs: TinyVGA RGB222 mapping
  uo[0]: "VGA R1"
  uo[1]: "VGA G1"
  uo[2]: "VGA B1"
  uo[3]: "VGA VSYNC"
  uo[4]: "VGA R0"
  uo[5]: "VGA G0"
  uo[6]: "VGA B0"
  uo[7]: "VGA HSYNC"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
