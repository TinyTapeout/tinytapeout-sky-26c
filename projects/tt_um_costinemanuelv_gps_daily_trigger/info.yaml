# Tiny Tapeout project information
project:
  title:        "GPS Daily Trigger"      # Project title
  author:       "Costin-Emanuel Vasile"      # Your name
  discord:      "costinemanuelv"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Configurable daily trigger generation synchronized to GPS UTC time and PPS"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_costinemanuelv_gps_daily_trigger"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_costinemanuelv_gps_daily_trigger.sv"
    - "uart_rx_compact.sv"
    - "nmea_rmc_time_parser.sv"
    - "gps_daily_trigger_core.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "UART_RX"
  ui[1]: "GPS_PPS"
  ui[2]: "ERR_CLR"
  ui[3]: "CONFIG_WE"
  ui[4]: "CONFIG_FLD_0"
  ui[5]: "CONFIG_FLD_1"
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "TRIG_OUT"
  uo[1]: "GPS_SENTENCE_OK"
  uo[2]: "GPS_SENTENCE_NOK"
  uo[3]: "GPS_FIX_INVALID"
  uo[4]: "CONFIG_ERR"
  uo[5]: "PPS_OUT"
  uo[6]: "UTC_PPS_LOCKED"
  uo[7]: "TARGET_CONFIGURED"

  # Bidirectional pins
  uio[0]: "CONFIG_DATA_BIT_0"
  uio[1]: "CONFIG_DATA_BIT_1"
  uio[2]: "CONFIG_DATA_BIT_2"
  uio[3]: "CONFIG_DATA_BIT_3"
  uio[4]: "CONFIG_DATA_BIT_4"
  uio[5]: "CONFIG_DATA_BIT_5"
  uio[6]: "CONFIG_DATA_BIT_6"
  uio[7]: "CONFIG_DATA_BIT_7"

# Do not change!
yaml_version: 6
