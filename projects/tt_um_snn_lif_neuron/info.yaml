# Tiny Tapeout project information
project:
  title:        "snn_lif_neurons"
  author:       "david"
  discord:      ""
  description:  "SNN heart-monitor classifier using banded LIF neurons"
  language:     "Verilog"
  clock_hz:     50000000

  tiles: "1x2"

  top_module:  "tt_um_snn_lif_neuron"

  source_files:
    - "project.v"
    - "SNN_Heart_Monitor_Top.v"
    - "Delta_Encoder.v"
    - "Heartbeat_Segmenter.v"
    - "Parallel_SNN_Matrix.v"
    - "Heart_Monitor_Neuron.v"
    - "MultiClass_SNN_Voter.v"

pinout:
  # Inputs
  ui[0]: "adc[0]"
