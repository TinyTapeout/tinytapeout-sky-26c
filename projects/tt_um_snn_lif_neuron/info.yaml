  ui[6]: "adc[6]"
  ui[7]: "adc[7]"

  # Outputs
  uo[0]: "class[0]"
  uo[1]: "class[1]"
  uo[2]: "class[2]"
  uo[3]: "diag_valid"
  uo[4]: "alarm"
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "adc[8]"
  uio[1]: "adc[9]"
  uio[2]: "adc[10]"
  uio[3]: "adc[11]"
  uio[4]: "sample_en"
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

