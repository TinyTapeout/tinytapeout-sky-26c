# Tiny Tapeout project information
project:
  title:        "Systolic Processing Element" # Project title
  author:       "Hayden Evans"      # Your name
  discord:      "hayden_evans"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A weight-stationary processing element (PE) implementing the core compute primitive of a systolic array neural network accelerator." # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000  # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_haydenevans_top"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "shared data bus[0]"
  ui[1]: "shared data bus[1]"
  ui[2]: "shared data bus[2]"
  ui[3]: "shared data bus[3]"
  ui[4]: "shared data bus[4]"
  ui[5]: "shared data bus[5]"
  ui[6]: "shared data bus[6]"
  ui[7]: "shared data bus[7]"

  # Outputs
  uo[0]: "output[0]"
  uo[1]: "output[1]"
  uo[2]: "output[2]"
  uo[3]: "output[3]"
  uo[4]: "output[4]"
  uo[5]: "output[5]"
  uo[6]: "output[6]"
  uo[7]: "output[7]"

  # Bidirectional pins
  uio[0]: "load_weight (input)"
  uio[1]: "load_bias (input)"
  uio[2]: "accumulate (input)"
  uio[3]: "reset_acc (input)"
  uio[4]: "output_valid (output)"
  uio[5]: "overflow_out"
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
