# Tiny Tapeout project information
project:
  title:        "last_minute_Pong"      # Project title
  author:       "Ryan Ranjitkar"      # Your name
  discord:      "illurity"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Play Pong on a VGA display"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_rmranjitkarNULL_pong_top"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - ball_painter.v
    - border_painter.v
    - pong.v
    - game_logic.v
    - lives_painter.v
    - paddles_painter.v
    - sound_gen.v
    - synchronizer.v
    - tt_um_rmranjitkarNULL_pong_top.v
    - vga_timing.v
    - video_mux.v

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: "P2_LEFT"
  ui[3]: "P2_RIGHT"
  ui[4]: "P2_SELECT"
  ui[5]: "P1_LEFT"
  ui[6]: "P1_RIGHT"
  ui[7]: "P1_SELECT"

  # Outputs
  uo[0]: "HSYNC"
  uo[1]: "VSYNC"
  uo[2]: "R0"
  uo[3]: "R1"
  uo[4]: "G0"
  uo[5]: "G1"
  uo[6]: "B0"
  uo[7]: "B1"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: "HBLANK"
  uio[2]: "VBLANK"
  uio[3]: "SOUND"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
