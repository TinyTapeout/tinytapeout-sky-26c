# Tiny Tapeout project information
project:
  title:        "17-bit Wallace-tree POPCNT with shift-register input"
  author:       "Rao M. Ghayas Udin , Namra Mazhar"
  discord:      ""
  description:  "A sequentially loaded 17-bit Wallace-tree population counter using 16-bit parallel loading and one serial input bit"
  language:     "Verilog"
  clock_hz:     100000000

  tiles: "1x1"

  top_module: "tt_um_namramazhar_popcnt_shiftreg"

  source_files:
    - "project.v"
    - "wallace_popcnt17.v"

pinout:
  # Parallel data inputs
  ui[0]: "D0 / SERIAL_D16"
  ui[1]: "D1"
  ui[2]: "D2"
  ui[3]: "D3"
  ui[4]: "D4"
  ui[5]: "D5"
  ui[6]: "D6"
  ui[7]: "D7"

  # Outputs
  uo[0]: "P0"
  uo[1]: "P1"
  uo[2]: "P2"
  uo[3]: "P3"
  uo[4]: "P4"
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Upper parallel data byte
  uio[0]: "D8"
  uio[1]: "D9"
  uio[2]: "D10"
  uio[3]: "D11"
  uio[4]: "D12"
  uio[5]: "D13"
  uio[6]: "D14"
  uio[7]: "D15"

yaml_version: 6
