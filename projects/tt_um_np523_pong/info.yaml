# Tiny Tapeout project information
project:
  title:        "Pong"      # Project title
  author:       "Neil Pakrasi"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Pong with Retro Visuals and AI"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25175000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_np523_pong"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "ai_opponent.sv"
    - "ball_painter.sv"
    - "border_painter.sv"
    - "copper_bars_painter.sv"
    - "game_logic.sv"
    - "lives_painter.sv"
    - "paddle_painter.sv"
    - "pong.sv"
    - "starfield_painter.sv"
    - "synchronizer.sv"
    - "tt_um_np523_pong.sv"
    - "vga_timing.sv"
    - "video_mux.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "AI mode select"
  ui[1]: ""
  ui[2]: "P2 paddle left"
  ui[3]: "P2 paddle right"
  ui[4]: "P2 select / serve"
  ui[5]: "P1 paddle left"
  ui[6]: "P1 paddle right"
  ui[7]: "P1 select / serve"

  # Outputs
  uo[0]: "VGA R1"
  uo[1]: "VGA G1"
  uo[2]: "VGA B1"
  uo[3]: "VGA VSYNC"
  uo[4]: "VGA R0"
  uo[5]: "VGA G0"
  uo[6]: "VGA B0"
  uo[7]: "VGA HSYNC"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: "hblank (output)"
  uio[2]: "vblank (output)"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
