  ui[4]: "gpi4"
  ui[5]: "gpi5"
  ui[6]: "gpi6"
  ui[7]: "gpi7"

  # Outputs
  uo[0]: "gpo0/pwm0"
  uo[1]: "gpo1/pwm1"
  uo[2]: "gpo2/pwm2"
  uo[3]: "gpo3/pwm3"
  uo[4]: "gpo4/pwm4"
  uo[5]: "gpo5/pwm5"
  uo[6]: "gpo6/pwm6"
  uo[7]: "gpo7/pwm7"

  # Bidirectional pins
