project:
  title:        "TinyMind SoC"
  author:       "Sishi"
  discord:      ""
  description:  "A tiny processor-controlled 8-input, 3-class fixed-weight inference accelerator with a custom CPU, program ROM, clocked TinyMind core, confidence logic, and seven-segment output."
  language:     "Verilog"
  clock_hz:     10000000
  tiles:        "1x1"
  top_module:   "tt_um_sishi888_tinymind"

  source_files:
    - "project.v"


