# Tiny Tapeout project information

project:
  title: "Configurable CAM with Masked Pattern Matching and Priority Resolution"
  author: "Vaishnavi Patil, Nishaaanth K S, Shylashree N, RV College Of Engineering"
  discord: ""
  description: "An 8-entry 8-bit configurable CAM supporting exact matching, masked pattern matching, and priority-based match resolution."
  language: "Verilog"
  clock_hz: 100000000
  tiles: "1x1"

  top_module: "tt_um_vaishnavipatil5_configurable_cam"

  source_files:
    - "project.v"
    - "configurable_cam.v"

pinout:
  ui[0]: "Data bit 0"
  ui[1]: "Data bit 1"
  ui[2]: "Data bit 2"
  ui[3]: "Data bit 3"
  ui[4]: "Data bit 4"
  ui[5]: "Data bit 5"
  ui[6]: "Data bit 6"
  ui[7]: "Data bit 7"

  uo[0]: "Match"
  uo[1]: "Match address bit 0"
  uo[2]: "Match address bit 1"
  uo[3]: "Match address bit 2"
  uo[4]: "Unused"
  uo[5]: "Unused"
  uo[6]: "Unused"
  uo[7]: "Unused"

  uio[0]: "Write address bit 0"
  uio[1]: "Write address bit 1"
  uio[2]: "Write address bit 2"
  uio[3]: "Write enable"
  uio[4]: "Load mask"
  uio[5]: "Search enable"
  uio[6]: "Unused"
  uio[7]: "Unused"

yaml_version: 6
