# Tiny Tapeout project information
project:
  title:        "8-bit Modified RISC-V"      # Project title
  author:       "UCLA Digital Tapeout"      # Your name
  discord:      "sugaroats"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "An 8-bit modified RISC-V processor"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_spi_reg_bank"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_spi_reg_bank.sv"
    - "alu_ops.svh"
    - "alu.sv"
    - "control.sv"
    - "cpu_spi_top.sv"
    - "cpu_top.sv"
    - "dmem.sv"
    - "imem.sv"
    - "pc.sv"
    - "rf.sv"
    - "run_controller.sv"
    - "spi_slave.sv"
    - "synchronizer.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "DMEM[0]"
  uo[1]: "DMEM[1]"
  uo[2]: "DMEM[2]"
  uo[3]: "DMEM[3]"
  uo[4]: "DMEM[4]"
  uo[5]: "DMEM[5]"
  uo[6]: "DMEM[6]"
  uo[7]: "DMEM[7]"

  # Bidirectional pins
  uio[0]: "CS"
  uio[1]: "MOSI"
  uio[2]: "MISO"
  uio[3]: "SCK"
  uio[4]: "DEBUG PC[0]"
  uio[5]: "DEBUG PC[1]"
  uio[6]: "CPU_DONE"
  uio[7]: ""

# Do not change!
yaml_version: 6
