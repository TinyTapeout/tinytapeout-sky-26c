# Tiny Tapeout project information
project:
  title:        "Poly Synth v1.0"      # Project title
  author:       "Colby Miller"      # Your name
  discord:      "Colbywonn"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Three-voice polyphonic DDS synthesizer with SPI control and 1-bit sigma-delta audio output."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     12000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_colbywonn_poly_synth"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_colbywonn_poly_synth.v"
    - "synth_core.v"
    - "spi_peripheral.v"
    - "dds.v"
    - "phase_acc.v"
    - "shaper.v"
    - "mixer.v"
    - "sigma_delta.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "MOSI"
  ui[1]: "SCLK"
  ui[2]: "CS_N"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "Audio"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
