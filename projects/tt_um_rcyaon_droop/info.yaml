# Tiny Tapeout project information
project:
  title:        "All-Digital Supply Droop Detector"
  author:       "rcyaon"
  discord:      "lenaphobic"
  description:  "Ring-oscillator VDD sensor with on-tile switching aggressor; reports RO period or frequency to watch the tile's own supply sag"
  language:     "Verilog"
  clock_hz:     50000000
  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"
  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_rcyaon_droop"
  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_rcyaon_droop.v"
    - "ro_osc.v"
    - "droop_sensor.v"
    - "aggressor.v"
# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "AGG_MODE0"
  ui[1]: "AGG_MODE1"
  ui[2]: "AGG_TRIG"
  ui[3]: "AGG_LEN0"
  ui[4]: "AGG_LEN1"
  ui[5]: "AGG_LEN2"
  ui[6]: "MEAS_MODE"
  ui[7]: "RO_EN"
  # Outputs
  uo[0]: "SAMPLE0"
  uo[1]: "SAMPLE1"
  uo[2]: "SAMPLE2"
  uo[3]: "SAMPLE3"
  uo[4]: "SAMPLE4"
  uo[5]: "SAMPLE5"
  uo[6]: "SAMPLE6"
  uo[7]: "SAMPLE7"
  # Bidirectional pins
  uio[0]: "TAP_SEL0"
  uio[1]: "TAP_SEL1"
  uio[2]: "ST_SEL"
  uio[3]: "VALID"
  uio[4]: "AGG_ACTIVE"
  uio[5]: "RO_DIV"
  uio[6]: "SAT"
  uio[7]: "HEARTBEAT"
# Do not change!
yaml_version: 6
