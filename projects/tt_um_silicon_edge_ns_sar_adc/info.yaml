# Tiny Tapeout project information
project:
  title:        "NS SAR ADC"      # Project title
  author:       "Silicon Edge"      # Your name
  discord:      "kavishka_21141"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "This is a research project designing a noise shaping SAR ADC design"      # One line description of what your project does
  language:     "Analog" # other examples include Verilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values for analog projects: 1x2, 2x2

  # How many analog pins does your project use?
  analog_pins: 6        # Valid values: 0 to 6
  uses_vapwr: false       # Set to true if your project uses second analog power supply (VAPWR) in addition to 1.8V (VDPWR)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_silicon_edge_ns_sar_adc"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:        
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "B0"
  uo[1]: "B1"
  uo[2]: "B2"
  uo[3]: "B3"
  uo[4]: "B4"
  uo[5]: "B5"
  uo[6]: "B6"
  uo[7]: "B7"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

  # Analog pins - make sure to also set "analog_pins" above, else the pins won't be connected
  ua[0]: "VCM"
  ua[1]: "VIN"
  ua[2]: "VIP"
  ua[3]: "VREF_P"
  ua[4]: "VREF_N"
  ua[5]: "IBIAS"

# Do not change!
yaml_version: 6
