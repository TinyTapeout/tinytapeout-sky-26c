# Tiny Tapeout project information
project:
  title:        "DTMF (Touch-Tone) decoder"      # Project title
  author:       "YJ Eum"      # Your name
  discord:      "yjeum11"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Decodes dialing sounds from your telephone"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_yjeum11"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "goertzel_iir.v"
    - "serial_mult.v"
    - "power_calculate.v"
    - "coeff_ram.v"
    - "lib.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "sample[0]"
  ui[1]: "sample[1]"
  ui[2]: "sample[2]"
  ui[3]: "sample[3]"
  ui[4]: "sample[4]"
  ui[5]: "sample[5]"
  ui[6]: "sample[6]"
  ui[7]: "sample[7]"

  # Outputs
  uo[0]: "max_row_idx[0]"
  uo[1]: "max_row_idx[1]"
  uo[2]: "max_row_idx[2]"
  uo[3]: "max_row_idx[3]"
  uo[4]: "max_col_idx[0]"
  uo[5]: "max_col_idx[1]"
  uo[6]: "max_col_idx[2]"
  uo[7]: "max_col_idx[3]"

  # Bidirectional pins
  uio[0]: "sample_ready (output)"
  uio[1]: "sample_valid (input)"
  uio[2]: "result_valid (output)"
  uio[3]: "unused"
  uio[4]: "unused"
  uio[5]: "unused"
  uio[6]: "unused"
  uio[7]: "unused"

# Do not change!
yaml_version: 6
