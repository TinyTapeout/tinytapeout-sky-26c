# Tiny Tapeout project information
project:
  title:        "Tiny ALU PD"
  author:       "rangfuu"
  discord:      ""
  description:  "4-bit ALU with hexadecimal 7-segment display and physical-design experiments"
  language:     "Verilog"
  clock_hz:     0
  tiles: "1x1"
  top_module:  "tt_um_rangfuu_alu"
  source_files:
    - "project.v"

pinout:
  ui[0]: "A0"
  ui[1]: "A1"
  ui[2]: "A2"
  ui[3]: "A3"
  ui[4]: "B0"
  ui[5]: "B1"
  ui[6]: "B2"
  ui[7]: "B3"

  uo[0]: "segment_a"
  uo[1]: "segment_b"
  uo[2]: "segment_c"
  uo[3]: "segment_d"
  uo[4]: "segment_e"
  uo[5]: "segment_f"
  uo[6]: "segment_g"
  uo[7]: "decimal_point_carry_borrow"

  uio[0]: "op0"
  uio[1]: "op1"
  uio[2]: "op2"
  uio[3]: "zero (output)"
  uio[4]: "Y0 (output)"
  uio[5]: "Y1 (output)"
  uio[6]: "Y2 (output)"
  uio[7]: "Y3 (output)"

yaml_version: 6
