# Tiny Tapeout project information
project:
  title:        "Single-Bit Macro Regime Classifier"      # Project title
  author:       "Shaun M. Rowles"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "8-bit stream feeds a shift-only EMA compared against a programmable threshold with hysteresis; one output bit answers: in the regime, or not"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_rowles_regime"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "DATA0 (sample bit 0, or config value during a load strobe)"
  ui[1]: "DATA1"
  ui[2]: "DATA2"
  ui[3]: "DATA3"
  ui[4]: "DATA4"
  ui[5]: "DATA5"
  ui[6]: "DATA6"
  ui[7]: "DATA7 (MSB)"

  # Outputs
  uo[0]: "EMA1 (running average bit 1)"
  uo[1]: "EMA2"
  uo[2]: "EMA3"
  uo[3]: "EMA4"
  uo[4]: "EMA5"
  uo[5]: "EMA6"
  uo[6]: "EMA7 (running average MSB)"
  uo[7]: "REGIME (1 = in regime)"

  # Bidirectional pins
  uio[0]: "K0 (smoothing shift, bit 0)"
  uio[1]: "K1"
  uio[2]: "K2 (k=1..7; 0 treated as 1)"
  uio[3]: ""
  uio[4]: ""
  uio[5]: "LOAD_PERSIST (strobe: latch ui as N-consecutive requirement)"
  uio[6]: "LOAD_HYST (strobe: latch ui as hysteresis)"
  uio[7]: "LOAD_THRESH (strobe: latch ui as threshold)"

# Do not change!
yaml_version: 6
