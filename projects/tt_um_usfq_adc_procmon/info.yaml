# Tiny Tapeout project information
project:
  title: "USFQ 8-bit Tracking ADC and Process Variation Monitor"
  author: "Esteban Astudillo, Raul Villalba, Diego Guevara, Emilia Casares"
  discord: ""
  description: "SKY130 mixed-signal chip integrating an 8-bit tracking ADC and an on chip process variation monitor."
  language: "Analog"
  clock_hz: 100000000

  tiles: "1x2"
  analog_pins: 2
  uses_vapwr: false

  top_module: "tt_um_usfq_adc_procmon"

  source_files:
    - "project.v"


pinout:

  # Digital inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: "CLK_IN"


  # Dedicated outputs
  uo[0]: ""
  uo[1]: ""
  uo[2]: "PMOS_RING_3"
  uo[3]: "PMOS_RING_2"
  uo[4]: "PMOS_RING_1"
  uo[5]: "NMOS_RING_3"
  uo[6]: "NMOS_RING_2"
  uo[7]: "NMOS_RING_1"


  # Bidirectional pins used as outputs
  uio[0]: "COUNT[0]"
  uio[1]: "COUNT[1]"
  uio[2]: "COUNT[2]"
  uio[3]: "COUNT[3]"
  uio[4]: "COUNT[4]"
  uio[5]: "COUNT[5]"
  uio[6]: "COUNT[6]"
  uio[7]: "COUNT[7]"


  # Analog pins
  ua[0]: "VDAC"
  ua[1]: "VIN"
  ua[2]: ""
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""


# Do not change!
yaml_version: 6