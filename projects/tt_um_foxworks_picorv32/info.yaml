# Tiny Tapeout project information
project:
  title:        "TCD Foxworks PicoRV32"
  author:       "Michael John Flynn"
  discord:      "mjvf"
  description:  "Modified open source PicoRV32 core to target TinyTapeout"
  language:     "Verilog"
  clock_hz:     25000000       # 25MHz 25_000_000, GDS targets 50MHz

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x2"

  top_module:  "tt_um_foxworks_picorv32"

  source_files:
    - "tt_um_foxworks_picorv32.v"
    - "picosoc.v"
    - "picorv32.v"
    - "simpleuart.v"
    - "spimemio.v"

pinout:
  # Inputs
  ui[0]: "GPIO in 0"
  ui[1]: "GPIO in 1"
  ui[2]: "GPIO in 2"
  ui[3]: "GPIO in 3"
  ui[4]: "GPIO in 4"
  ui[5]: "GPIO in 5"
  ui[6]: "GPIO in 6"
  ui[7]: "GPIO in 7"
  # Outputs
  uo[0]: "GPIO out 0"
  uo[1]: "GPIO out 1"
  uo[2]: "GPIO out 2"
  uo[3]: "GPIO out 3"
  uo[4]: "GPIO out 4"
  uo[5]: "GPIO out 5"
  uo[6]: "GPIO out 6"
  uo[7]: "GPIO out 7"
  # Bidirectional pins
  uio[0]: "FLASH_SCK"
  uio[1]: "FLASH_CSB"
  uio[2]: "FLASH_IO0 (MOSI)"
  uio[3]: "FLASH_IO1 (MISO)"
  uio[4]: "FLASH_IO2 (/WP, driven 1)"
  uio[5]: "FLASH_IO3 (/HOLD, driven 1)"
  uio[6]: "SERIAL_TX"
  uio[7]: "SERIAL_RX"

# Do not change!
yaml_version: 6
