<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="900" height="320" fill="#ffffff"/>
  <text x="20" y="30" font-size="15" font-weight="bold" fill="#333">Burst-mode output envelope (uio_in[1] = 1)</text>

  <!-- burst_en trace -->
  <text x="20" y="90" font-size="12" fill="#333">burst_en</text>
  <path d="M100,95 L100,70 L280,70 L280,95 L680,95 L680,70 L860,70"
        fill="none" stroke="#15803d" stroke-width="2.5"/>
  <text x="150" y="60" font-size="11" fill="#15803d">high (200 ms)</text>
  <text x="420" y="112" font-size="11" fill="#15803d">low (800 ms)</text>

  <!-- pwm out trace -->
  <text x="20" y="180" font-size="12" fill="#333">uo_out[0]</text>
  <g stroke="#6d28d9" stroke-width="2">
    <path d="M100,185 L112,185 L112,165 L124,165 L124,185 L136,185 L136,165 L148,165 L148,185
             L160,185 L160,165 L172,165 L172,185 L184,185 L184,165 L196,165 L196,185
             L208,185 L208,165 L220,165 L220,185 L232,185 L232,165 L244,165 L244,185
             L256,185 L256,165 L268,165 L268,185 L280,185" fill="none"/>
  </g>
  <line x1="280" y1="185" x2="680" y2="185" stroke="#6d28d9" stroke-width="2"/>
  <g stroke="#6d28d9" stroke-width="2">
    <path d="M680,185 L692,185 L692,165 L704,165 L704,185 L716,185 L716,165 L728,165 L728,185
             L740,185 L740,165 L752,165 L752,185 L764,185 L764,165 L776,165 L776,185
             L788,185 L788,165 L800,165 L800,185 L812,185 L812,165 L824,165 L824,185
             L836,185 L836,165 L848,165 L848,185 L860,185" fill="none"/>
  </g>
  <text x="150" y="205" font-size="11" fill="#6d28d9">PWM pulses present</text>
  <text x="420" y="205" font-size="11" fill="#999">no pulses (masked by burst_en)</text>

  <!-- time axis -->
  <line x1="100" y1="240" x2="860" y2="240" stroke="#555" stroke-width="1.5"/>
  <line x1="100" y1="235" x2="100" y2="245" stroke="#555" stroke-width="1.5"/>
  <line x1="280" y1="235" x2="280" y2="245" stroke="#555" stroke-width="1.5"/>
  <line x1="680" y1="235" x2="680" y2="245" stroke="#555" stroke-width="1.5"/>
  <line x1="860" y1="235" x2="860" y2="245" stroke="#555" stroke-width="1.5"/>
  <text x="95" y="260" font-size="10" fill="#555">0 ms</text>
  <text x="265" y="260" font-size="10" fill="#555">200 ms</text>
  <text x="665" y="260" font-size="10" fill="#555">1000 ms</text>
  <text x="820" y="260" font-size="10" fill="#555">1200 ms</text>

  <text x="20" y="295" font-size="10" fill="#777">Note: individual PWM pulse widths are exaggerated here for clarity — actual pulse rate is 10 Hz or 150 Hz depending on speed select.</text>
</svg>
