# Tiny Tapeout project information
project:
  title:        "TENs device frequency controller"      # Project title
  author:       "Kelly Leung"      # Your name
  discord:      "oohlala0614"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "This is a device to control the pulses of a TENs device depending on the input value."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     38400       # Clock frequency in Hz (or 0 if not applicable) this is 150 * 2^8

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_K_coder_9"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "PWM_generator.v"
    - "burst_gen.v"
    - "clock_mux.v"
    - "low_clk.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Duty Ratio bit 0"
  ui[1]: "Duty Ratio bit 1"
  ui[2]: "Duty Ratio bit 2"
  ui[3]: "Duty Ratio bit 3"
  ui[4]: "Duty Ratio bit 4"
  ui[5]: "Duty Ratio bit 5"
  ui[6]: "Duty Ratio bit 6"
  ui[7]: "Duty Ratio bit 7"

  # Outputs
  uo[0]: "pwm_out"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "SPEED_SEL"
  uio[1]: "MODE SEL"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
