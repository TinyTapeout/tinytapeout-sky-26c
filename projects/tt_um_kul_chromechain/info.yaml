# Tiny Tapeout project information
project:
  title:        "Chrome Chain"
  author:       "KU Leuven TT2026 Group 03"
  discord:      ""
  description:  "Ternary bit-serial MNIST classifier with a distribution-free conformal early exit"
  language:     "Verilog"

  # 10 MHz for bring-up, NOT the ceiling. The synthesis flow reports a 27.0 ns critical
  # path for the wrapped top (abc, sky130 tt_025C_1v80, pre-P&R) -- about 37 MHz -- and
  # that path is the whole pixel chain in one cycle: plane buffer -> popcount -> pixel
  # scanner -> W1 ROM -> 32 MAC lanes -> accumulator. The individual blocks are all fast
  # (exit_tree_2stage 8.6 ns, l1_horner_acc 7.2 ns); the composition is not. Every claim
  # this design makes is about CYCLES, which do not depend on the clock, so running
  # slower costs the design nothing. Raise this only after real STA post-P&R.
  clock_hz:     10000000

  # 4x2. Post-P&R on the green run: 71.3% utilisation of the 149,183 um2 4x2 core,
  # of which real cells (excluding fill and tap) are 90,418 um2 = 60.6%. In a 3x2 core
  # (~111,900 um2) the same cells would be 80.8% against PL_TARGET_DENSITY_PCT 60, so
  # 3x2 is not an option.
  tiles: "4x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_kul_chromechain"

  # Every module the design instantiates. Must stay identical to PROJECT_SOURCES in
  # test/Makefile: the GDS builds from this list and the tests build from that one, so
  # a file in one and not the other means the thing simulated is not the thing taped
  # out. ckpt_defs.vh is `included by most of these and lives in src/ too, but it is a
  # header, not a source file, so it is not listed.
  source_files:
    - "tt_um_kul_chromechain.v"
    - "cc_top.v"
    - "top_fsm.v"
    - "blob_loader.v"
    - "w1_rom_final4.v"
    - "ckpt_block.v"
    - "bitplane_buffer.v"
    - "popcount.v"
    - "active_pixel_scan.v"
    - "l1_horner_acc.v"
    - "l1_horner_cnt.v"
    - "l1_acc_shadow.v"
    - "l1_acc_shadow_cg.v"
    - "checkpoint_ctrl.v"
    - "requant_rom_x4.v"
    - "l2_weight_rom_x4.v"
    - "config_latch.v"
    - "requant_unit.v"
    - "l2_mac_x4.v"
    - "max2_node.v"
    - "exit_tree_2stage.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs -- one 8 b data bus, shared by pixel beats and config words. The host must
  # not drive both at once: nothing in the chip gates a config write on BUSY (K12 is
  # the opposite interlock, START is ignored until a blob is loaded), so a config word
  # strobed mid-image lands in the latch immediately.
  ui[0]: "DATA0"
  ui[1]: "DATA1"
  ui[2]: "DATA2"
  ui[3]: "DATA3"
  ui[4]: "DATA4"
  ui[5]: "DATA5"
  ui[6]: "DATA6"
  ui[7]: "DATA7"

  # Outputs -- view 0 of the status mux (DFT_SEL = 0). Views 1-3 carry the config
  # word at the loader's address (only meaningful mid-load; undefined after a complete
  # load, see cc_top.v), the exit index, and the five sticky alarms individually.
  uo[0]: "ANSWER0"
  uo[1]: "ANSWER1"
  uo[2]: "ANSWER2"
  uo[3]: "ANSWER3"
  uo[4]: "DONE"
  uo[5]: "LD_READY"
  uo[6]: "BUSY"
  uo[7]: "ERR"

  # Bidirectional pins -- all inputs (uio_oe = 0), control only. The chip never drives
  # them, so there is no direction hazard.
  uio[0]: "LD_EN"
  uio[1]: "LD_VSTROBE"
  uio[2]: "CFG_MODE"
  uio[3]: "CFG_STB"
  uio[4]: "START"
  uio[5]: "DFT_SEL0"
  uio[6]: "DFT_SEL1"
  uio[7]: "RESERVED"

# Do not change!
yaml_version: 6
